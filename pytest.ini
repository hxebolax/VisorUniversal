[pytest]
# Batería de pruebas del Visor Universal.
#
# Se lanza entera con:
#
#     entorno\Scripts\python.exe -m pytest
#
# o desde el menú de VisorUniversal.bat, opción P.
#
# Las pruebas viven en «pruebas» y están escritas en español, igual que el
# resto del programa: el nombre de una prueba que falla es lo primero que se
# lee, y se entiende mejor en el idioma en el que está escrito todo lo demás.
testpaths = pruebas
python_files = test_*.py
python_functions = test_*
python_classes = Prueba*

# «-q» porque la salida larga de pytest es incomodísima de oír; «-r fE» para
# que sí se cuente en detalle lo que falla, que es lo único que interesa.
addopts = -q -r fE --strict-markers

# Los avisos de bibliotecas ajenas no dicen nada del programa y llenan la
# salida; los propios sí se quieren ver.
filterwarnings =
    ignore::DeprecationWarning:wx.*
    ignore::DeprecationWarning:pkg_resources.*

# Una prueba «lenta» es la que trabaja sobre un archivo grande de verdad: la
# portada de un periódico de 1883 con treinta y cinco mil formas, por ejemplo.
# Son pocas y son las que de verdad demuestran algo, así que se ejecutan por
# omisión; para una vuelta rápida mientras se programa:
#
#     entorno\Scripts\python.exe -m pytest -m "not lenta"
markers =
    lenta: tarda segundos porque trabaja sobre un archivo grande de verdad
